<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <meta name="googlebot" content="noindex,follow">
    <title>500 サーバーエラー｜富山県学生寮</title>
    <style>
        /* CSS変数の定義 */
        :root {
            --text-dark: #1d1d1f;
            --text-light: #6e6e73;
            --glass-bg: rgba(242, 242, 247, 0.75);
            --glass-blur: blur(20px);
            --glass-saturate: saturate(180%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff3b30 0%, #ff9500 100%);
            padding: 2rem;
        }

        .error-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-saturate) var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-saturate) var(--glass-blur);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            text-align: center;
            max-width: 500px;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff3b30 0%, #ff9500 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }

        .error-description {
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .error-button {
            background: linear-gradient(135deg, #ff3b30 0%, #ff9500 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.3);
        }

        .error-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 59, 48, 0.4);
        }

        .error-button.focused {
            box-shadow: 0 8px 25px rgba(255, 59, 48, 0.5);
        }
    </style>
</head>
<body>
    <main class="error-container">
        <div class="error-card">
            <p class="error-code" aria-hidden="true">500</p>
            <h1 class="error-message">サーバーエラー</h1>
            <div class="error-description">
                サーバーで内部エラーが発生しました。<br>
                しばらくしてから再度お試しください。
            </div>
            <a href="index.html" class="error-button">トップページに戻る</a>
        </div>
    </main>
    <script>
        (() => {
            'use strict';

            const button = document.querySelector('.error-button');
            if (button) {
                button.addEventListener('focus', () => button.classList.add('focused'));
                button.addEventListener('blur', () => button.classList.remove('focused'));
            }
        })();
    </script>
</body>
</html>
